# --- Serveur: accessible ghir mn nafs l'PC ---
server.port=8081
server.address=127.0.0.1

# --- SQLite (app.data.dir kay-t7ded f GestionApplication) ---
spring.datasource.url=jdbc:sqlite:${app.data.dir}/data.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
#management.endpoint.health.show-details=always
management.health.db.enabled=false

# --- Actuator (l'Launcher kayستعml health) ---
management.endpoints.web.exposure.include=health
app.launcher.enabled=true
spring.main.banner-mode=off
logging.file.name=${app.data.dir}/logs/gestion.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=5
